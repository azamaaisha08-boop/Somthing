<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:radial-gradient(circle,#1a001f,#000);
overflow:hidden;
}

.card{

width:320px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

text-align:center;

box-shadow:0 0 40px rgba(255,0,100,.4);

animation:zoom 1.5s ease;

}

.card h1{

font-size:35px;

margin-bottom:15px;

}

.card p{

font-size:18px;

margin-bottom:30px;

}

#next{

padding:15px 35px;

border:none;

border-radius:50px;

background:#ff2d75;

color:#fff;

font-size:18px;

cursor:pointer;

box-shadow:0 0 20px #ff2d75;

}

@keyframes zoom{

from{

opacity:0;

transform:scale(.6);

}

to{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Welcome ❤️</h1>

<p>

Every heartbeat reminds me of you...

</p>

<button id="next">

Continue ❤️

</button>

</div>

<script>

document.getElementById("next").onclick=function(){

window.location.href="letter.html";

}

</script>

</body>
</html>
